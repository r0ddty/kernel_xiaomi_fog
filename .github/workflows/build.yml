name: Build Custom Kernel (fog)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev libncursesw5-dev \
            bison flex libelf-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev zip unzip git wget curl

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          cd ..

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out fog_defconfig
          
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3
          
          # anykernel.sh mein fog device specify karein
          sed -i 's/device.name1=.*/device.name1=fog/g' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=wind/g' AK3/anykernel.sh
          
          # Compiled Kernel Binary copy karein
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AK3/
          fi
          
          cd AK3
          zip -r9 ../Kernel-Fog-Signed.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Custom-Kernel-Fog
          path: Kernel-Fog-Signed.zip
          
